[project]
name = "openevalz-eval-mle-bench"
version = "0.1.0"
description = "OpenEvalz packaging of MLE-bench: Evaluating Machine Learning Agents on Machine Learning Engineering"
license = { text = "BUSL-1.1" }
requires-python = ">=3.10"
dependencies = [
  "inspect-ai==0.3.260",
  "trusted-router-py>=0.7.0",
  "pyyaml>=6",
]

[tool.openevalz]
eval = "mle_bench"
execution_class = "sandbox-local"
cost_class = "high"
